task: ObjectNav
agent_cls: ObjectNavAgent
env_cls: ObjectNavEnv

agent_cfg:
  navigability_mode: 'depth_sensor' # one of ['none' (ours w/o nav), 'depth_estimate' (ZoeDepth), 'segmentation' (Segformer), 'depth_sensor' (Ours)]
  project: true # to run the w/o proj baseline
  pivot: false
  context_history: 0 
  explore_bias: 4 


  vlm_score_threshold: 0.5




  meters_per_pixel: 0.005
  grid_spacing_m: 0.7




  # discourage_ratio: 0.6 
  discourage_ratio: 0.4


  # Calibrate using VLM. If this is higher, less result will be clipped
  # max_action_dist_calibration: 1.7
  max_action_dist_calibration: 2.5

  max_action_dist: 1.7
  # min_action_dist: 0.8 # clip action by a fixed number
  min_action_dist: 0.3 


  clip_frac: 1.0 # clip action a flat rate
  observe_frac: 0.5
  # observe_frac: 0.9 # we condiser at least 0.9 of the distance (0.1 from wall) for an observation to be considered as valid


  stopping_action_dist: 1.3 # length of actions after the agent calls stop
  # stopping_action_dist: 1.7 # 

  # default_action: 0.2 # how far forward to move if the VLM's chosen action is invalid
  default_action: 0.0



  spacing_ratio: 360 # ratio of FOV to theta_delta
  hard_spacing: 0.349066 # force 20 degree difference between each proposed action
  # hard_spacing: 0.3


  num_theta: 60 # number of angles to consider as actions
  image_edge_threshold: 0.04 # dont project actions if they are within 4% of the image edge

  # turn_around_cooldown: 3 # steps before the agent can turn around again
  turn_around_cooldown: 0





  # agent_radius: 0.17
  # clearance_m: 0.1 

  agent_radius: 0.1
  clearance_m: 0.05 
  Depth_aware: True






  navigability_height_threshold: 0.2 # threshold from the ground to consider navigable
  map_scale: 100 #pixels per meter
  vlm_cfg:
    # model_cls: GeminiVLM
    model_cls: ChatGPTVLM
    model_kwargs:
      # model: gemini-1.5-flash-001


      # model: gpt-4o-mini 

      model: gpt-5-nano
      # model: gpt-5.2-chat-latest

      


sim_cfg:
  # agent_height: 1.5
  # agent_radius: 0.17


  agent_height: 0.9
  agent_radius: 0.1







  allow_slide: true
  # allow_slide: false

  use_goal_image_agent: false
  sensor_cfg:
    # height: 1.5
    height: 0.9
    pitch: -0.45
    res_factor: 1
    # fov: 131
    # fov: 127
    fov: 69.5

env_cfg:
  num_episodes: 1
  # max_steps: 10
  max_steps: 20
  log_freq: 1
  split: val
  success_threshold: 0.3 
  instances: 1 # Partitions the dataset into this many instances
  instance: 0 # Run on this particular partition of the dataset
  parallel: false
  name: default
  port: 5000 # port for the flask server to aggreagte results from instances

  d_goal: 2.0
